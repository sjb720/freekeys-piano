appId: org.freekeys.app
productName: FreeKeys
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/songs
    to: songs
linux:
  target: [AppImage, deb]
  category: Education
  maintainer: FreeKeys contributors
  syncDesktopName: true
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
deb:
  artifactName: ${name}_${version}_${arch}.${ext}
win:
  target: [nsis]
  artifactName: ${productName}-${version}-windows-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
